<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cottage Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FBF3EC; --panel:#FFFAF5; --ink:#2B1F1D; --muted:#6E5853; --line:#F0DCD6;
  --rose:#E8B4BC; --rose-d:#C98991; --sage:#B5C79F; --sage-d:#7D9468; --peach:#F8DCCB; --cream:#FFF1C9;
  --sel:#FBE3E6; --veil:rgba(255,250,245,.55); --itembg:rgba(255,250,245,.82);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#2B2426; --panel:#352B2E; --ink:#F3E4E0; --muted:#B49C98; --line:#4A3C3F;
    --rose:#9C6B74; --rose-d:#E8B4BC; --sage:#667A56; --sage-d:#B5C79F; --peach:#7A5A4C; --cream:#7A6C47; --sel:#463438; --veil:rgba(43,36,38,.72); --itembg:rgba(53,43,46,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2B2426; --panel:#352B2E; --ink:#F3E4E0; --muted:#B49C98; --line:#4A3C3F;
  --rose:#9C6B74; --rose-d:#E8B4BC; --sage:#667A56; --sage-d:#B5C79F; --peach:#7A5A4C; --cream:#7A6C47; --sel:#463438; --veil:rgba(43,36,38,.72); --itembg:rgba(53,43,46,.85);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{display:grid;grid-template-columns:320px 1fr;height:100%;max-width:1100px;margin:0 auto}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:22px 20px 12px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:28px;margin:0 0 14px;color:var(--rose-d)}
.row{display:flex;gap:8px}
input,textarea,button,select{font:inherit;color:inherit}
select{color:var(--ink);font-weight:600}
select option{background:var(--panel);color:var(--ink)}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;outline:none}
.search:focus,.title:focus,.body:focus{outline:2px solid var(--sage);outline-offset:2px}
.btn{border:0;background:var(--rose);color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--rose-d)}
.btn:focus-visible,.item:focus-visible,.dot:focus-visible,.ghost:focus-visible{outline:2px solid var(--sage-d);outline-offset:2px}
.list{overflow:auto;padding:16px 12px 20px;flex:1}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:16px;padding:12px 14px;margin-bottom:4px;cursor:pointer;border-left:6px solid var(--c)}
.item:hover{background:var(--bg)}
.item.on{background:var(--sel);border-color:var(--line);border-left-color:var(--c)}
.item b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:36px 20px;line-height:1.5}
main{display:flex;flex-direction:column;min-height:0;padding:22px 32px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.dot.on{border-color:var(--ink)}
.sp{flex:1}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.ghost:hover{background:var(--sel);color:var(--ink)}
.back{display:none}
.title{border:0;background:transparent;font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:400;width:100%;padding:4px 0;outline:none;color:var(--ink)}
.title::placeholder,.body::placeholder{color:var(--muted)}
.meta{color:var(--muted);font-size:13px;margin:2px 0 12px}
.body{flex:1;border:0;resize:none;background:transparent;width:100%;line-height:1.75;font-size:17px;outline:none;padding:4px 0;font-family:'Fraunces',Georgia,serif}
.sort{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 10px;outline:none;cursor:pointer}
.ghost.warn{background:var(--rose);color:#fff;border-color:var(--rose)}
.pin{color:var(--rose-d);margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 12px 10px 20px;display:none;align-items:center;gap:14px;z-index:20;box-shadow:0 6px 24px rgba(94,74,71,.25)}
.toast.show{display:flex}
.toast button{border:0;background:var(--rose);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
.chips:empty{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip:hover{background:var(--bg)}
.chip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.frow{display:flex;align-items:center;gap:12px;margin:2px 0 12px;flex-wrap:wrap}
.folder{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;width:160px;outline:none}
.folder:focus{outline:2px solid var(--sage)}
.frow .meta{margin:0}
.items{flex:1;overflow:auto;padding:4px 0}
.it{display:flex;align-items:center;gap:10px;padding:4px 0}
.cb{width:20px;height:20px;accent-color:var(--sage-d);flex:none;cursor:pointer}
.it-text{flex:1;min-width:0;border:0;background:transparent;font-family:'Fraunces',Georgia,serif;font-size:17px;padding:6px 0;outline:none;border-bottom:1px solid transparent}
.it-text:focus{border-bottom-color:var(--sage)}
.it-text.done{text-decoration:line-through;color:var(--muted)}
.rm{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 8px;border-radius:999px}
.rm:hover{background:var(--sel);color:var(--ink)}
.addit{margin-top:8px;align-self:flex-start}

.item{background:var(--itembg)}
.item:hover{background:var(--panel)}
.links{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.link{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--sel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.link:hover{background:var(--rose);color:#fff}
.link:focus-visible{outline:2px solid var(--sage-d);outline-offset:2px}
.item{position:relative}
.stkrow{position:absolute;right:10px;top:8px;font-style:normal;font-size:14px;letter-spacing:1px}
.sheet{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.stk-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stk{position:absolute;border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer;pointer-events:auto;padding:2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.stk.new{animation:stamp .3s ease-out}
@keyframes stamp{0%{scale:1.9;opacity:0}100%{scale:1;opacity:1}}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 10px;border:1px solid var(--line);background:var(--panel);border-radius:18px;margin-bottom:10px;align-self:flex-start}
.ts{border:0;background:transparent;font-size:22px;cursor:pointer;border-radius:10px;padding:4px 6px}
.ts:hover{background:var(--sel)}
.tray small{color:var(--muted);font-size:12px;padding:0 6px}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:var(--panel);color:var(--ink);border:2px solid var(--rose);border-radius:999px;padding:14px 30px;font-family:'Fraunces',Georgia,serif;font-size:24px;box-shadow:0 8px 30px rgba(94,74,71,.25);z-index:30}
.pop.show{animation:popin 2.4s ease forwards}
@keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:29}
.cf{position:absolute;top:-24px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.ro-title{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:30px;margin:6px 0 2px}
.ro-body{white-space:pre-wrap;line-height:1.75;font-family:'Fraunces',Georgia,serif;font-size:17px;overflow:auto;flex:1;opacity:.85}
.stk,.ts{touch-action:none;cursor:grab}
.stk:active,.ts:active{cursor:grabbing}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.gst{position:fixed;z-index:40;pointer-events:none;font-size:36px;line-height:1;transform:translate(-50%,-50%) scale(1.15) rotate(-8deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.tray .ghost{padding:4px 12px;font-size:13px;margin-left:6px}
.chipdel{border:1px dashed var(--rose-d);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.chipdel:hover{background:var(--sel)}
.chipdel.warn{background:var(--rose);color:#fff;border-style:solid}
.friend{display:flex;align-items:flex-end;gap:8px;padding:6px 14px 8px;min-height:62px}
.pet{border:0;background:transparent;font-size:38px;line-height:1;cursor:pointer;padding:2px;border-radius:14px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:13px;line-height:1.35;opacity:0;transform:translateY(4px) scale(.96);transition:opacity .25s,transform .25s;pointer-events:none;max-width:210px;margin-bottom:6px}
.bubble:empty{display:none}
.bubble.show{opacity:1;transform:none}
.bubble::before{content:"";position:absolute;left:-6px;bottom:12px;width:10px;height:10px;background:var(--bg);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.tea{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:0 4px 16px rgba(94,74,71,.15);z-index:15}
.teabtn,.mutebtn,.petalbtn{border:0;background:transparent;cursor:pointer;border-radius:999px;font-size:22px;line-height:1;padding:6px 8px}
.mutebtn,.petalbtn{font-size:15px}
.petalbtn.off{opacity:.4}
.teabtn:hover,.mutebtn:hover,.petalbtn:hover,.pet:hover{background:var(--sel)}
.teabtn:focus-visible,.mutebtn:focus-visible,.petalbtn:focus-visible,.pet:focus-visible{outline:2px solid var(--sage-d);outline-offset:2px}
.tlabel{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.tea.on .teabtn{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.pt{position:absolute;top:-30px;border-radius:150% 0 150% 0;background:radial-gradient(circle at 30% 30%,#FFE9EE,#F2B6C4);animation:pfall linear infinite,psway ease-in-out infinite alternate}
@keyframes pfall{from{transform:translateY(-5vh) rotate(0deg)}to{transform:translateY(110vh) rotate(540deg)}}
@keyframes psway{from{translate:calc(var(--sw) * -1) 0}to{translate:var(--sw) 0}}
@media (prefers-reduced-motion:reduce){.petals{display:none!important}.pet,.tea.on .teabtn{animation:none}}
@media (max-width:720px){.tea{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.item.pinned{margin-top:10px}
.washi{position:absolute;top:-8px;width:68px;height:18px;transform:translateX(-50%) rotate(var(--wr,-2deg));filter:drop-shadow(0 1px 1px rgba(94,74,71,.3));pointer-events:none;text-decoration:none;z-index:1}
.washi::before{content:"";position:absolute;inset:0;opacity:.93;background:var(--wp);clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%)}
.w0{--wp:repeating-linear-gradient(45deg,#F6C5CF 0 6px,#FFF1F3 6px 12px)}
.w1{--wp:radial-gradient(circle,#fff 28%,transparent 30%) 0 0/9px 9px,#BFD3A8}
.w2{--wp:linear-gradient(90deg,rgba(255,255,255,.55) 50%,transparent 50%) 0 0/10px 10px,linear-gradient(0deg,rgba(255,255,255,.55) 50%,transparent 50%) 0 0/10px 10px,#F3DC94}
.w3{--wp:repeating-linear-gradient(90deg,#F8D3C0 0 5px,#FFF5EE 5px 10px)}
.washi.stick{animation:tape .35s ease-out}
@keyframes tape{0%{opacity:0;translate:0 -14px;scale:1.25}100%{opacity:1;translate:0 0;scale:1}}
@media (prefers-reduced-motion:reduce){.washi.stick{animation:none}}
.none{margin:auto;text-align:center;color:var(--muted);line-height:1.6}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  main{display:none;padding:16px 18px}
  .app.edit aside{display:none}
  .app.edit main{display:flex}
  .back{display:inline-block}
  .title{font-size:28px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="head">
      <h1>Cottage Notes</h1>
      <div class="row">
        <input class="search" id="q" type="search" placeholder="Search notes" aria-label="Search notes">
        <button class="btn" id="new">New note</button>
      </div>
      <div class="row" style="margin-top:10px"><select class="sort" id="sort" aria-label="Sort notes"><option value="new">Newest first</option><option value="title">By title</option><option value="color">By color</option></select><button class="ghost" id="tbtn">Trash</button></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
    <div class="friend" id="friend"><button class="pet" id="pet" aria-label="Your animal friend. Tap to change animal.">🐱</button><div class="bubble" id="bubble" role="status" aria-live="polite"></div></div>
    <div class="links"><a class="link" href="https://alizaabdullah350-bot.github.io/soft-hours/" target="_blank" rel="noopener noreferrer">Check out Soft Hours!</a><a class="link" href="https://alizaabdullah350-bot.github.io/cute-font-generator/" target="_blank" rel="noopener noreferrer">Check out cute font generator!</a></div>
  </aside>
  <main id="main"></main>
<div class="tea" id="tea"><button class="petalbtn" id="petalbtn" title="Falling petals on/off" aria-label="Falling petals on or off" aria-pressed="true">🌸</button><button class="mutebtn" id="mutebtn" title="Sounds on/off" aria-label="Sounds on or off" aria-pressed="false">🔔</button><span class="tlabel" id="tlabel"></span><button class="teabtn" id="teabtn" title="Start a 5-minute tea break" aria-label="Start a 5-minute tea break">☕</button></div>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="pop" id="pop" role="status" aria-live="polite">All Done! ✨</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>
</div>
<script>
(function(){
  var KEY='cottage-notes-v1';
  var COLORS=['#E8B4BC','#B5C79F','#F8DCCB','#F1D98F'];
  var notes=[],cur=null,q='',sortBy='new',armed=false,armT=null,trash=null,toastT=null,curFolder='',inTrash=false,trayOpen=false,armP=false,armPT=null,armE=false,armET=null,popT=null,armS=false,armST=null,armF=false,armFT=null,curTF=null,justPinned=null;
  var STK=['⭐','💖','🍄','🌸','🌷','🐞','🦋','✨','🍓','🌿','🧸','🎀'];
  var $=function(id){return document.getElementById(id)};
  function load(){
    try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(Array.isArray(d)&&d.length){return d}}}catch(e){}
    return [{id:uid(),title:'Welcome to the cottage',body:'Write anything here. Your notes save on their own, right in this browser.\n\nPick a color dot to tag a note, and use search to find it again.',color:0,t:Date.now()}];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}}
  function uid(){return Math.random().toString(36).slice(2,10)}
  function get(id){return notes.filter(function(n){return n.id===id})[0]}
  function fmt(t){return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+', '+new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function trashFolders(term){
    var m={},o=[];
    notes.forEach(function(n){if(n.deleted&&n.delFolder){if(!m[n.delFolder]){m[n.delFolder]={name:n.delFolder,count:0};o.push(m[n.delFolder])}m[n.delFolder].count++}});
    return o.filter(function(f){return !term||f.name.toLowerCase().indexOf(term)>-1}).sort(function(a,b){return a.name.localeCompare(b.name)});
  }
  function openTF(name){curTF=name;cur=null;$('app').classList.add('edit');renderList();renderMain()}
  function washi(n){
    if(!n.pin)return '';
    var h=0,i;for(i=0;i<n.id.length;i++)h+=n.id.charCodeAt(i);
    return '<u class="washi w'+(h%4)+(n.id===justPinned?' stick':'')+'" style="left:'+(28+(h%37))+'%;--wr:'+(((h%5)-2)*1.6)+'deg" aria-hidden="true"></u>';
  }
  function viewNotes(){return notes.filter(function(n){return inTrash?(!!n.deleted&&!n.delFolder):!n.deleted}).sort(function(a,b){return b.t-a.t})}
  function trayHTML(){return '<div class="tray">'+STK.map(function(e){return '<button class="ts" data-e="'+e+'" aria-label="Stamp '+e+'">'+e+'</button>'}).join('')+'<small>Drag a sticker onto your note · drag it off to remove</small><button class="ghost" id="clrstk">Remove all</button></div>'}
  function renderStickers(n,fresh){
    var l=$('stkl');if(!l)return;var a=n.stickers||[];
    l.innerHTML=a.map(function(s,i){return '<button class="stk'+(fresh&&i===a.length-1?' new':'')+'" data-si="'+i+'" style="left:'+s.x+'%;top:'+s.y+'%;transform:translate(-50%,-50%) rotate('+s.r+'deg)" aria-label="Sticker (drag to move, Delete to remove)" title="Drag to move · drag off the note to remove">'+s.e+'</button>'}).join('');
  }
  function stamp(n,e){
    n.stickers=n.stickers||[];
    n.stickers.push({e:e,x:10+Math.random()*80,y:12+Math.random()*80,r:Math.round(Math.random()*50-25)});
    if(n.stickers.length>16)n.stickers.shift();
    save();renderStickers(n,true);renderList();
  }
  function celebrate(){
    var pop=$('pop');pop.classList.remove('show');void pop.offsetWidth;pop.classList.add('show');
    clearTimeout(popT);popT=setTimeout(function(){pop.classList.remove('show')},2400);
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var c=$('confetti'),cols=['#E8B4BC','#B5C79F','#F1D98F','#F8DCCB','#C98991'],chars=['★','✦','✧','★','✶'];
    for(var i=0;i<30;i++){
      var s=document.createElement('span');s.className='cf';s.textContent=chars[i%chars.length];
      s.style.cssText='left:'+(10+Math.random()*80)+'%;color:'+cols[i%cols.length]+';font-size:'+(12+Math.random()*16)+'px;--dx:'+(Math.random()*160-80)+'px;--rot:'+(Math.random()*720-360)+'deg;animation-delay:'+(Math.random()*0.25)+'s;animation-duration:'+(1.4+Math.random()*0.9)+'s';
      c.appendChild(s);(function(el){setTimeout(function(){el.remove()},2800)})(s);
    }
  }
  function afterTrashChange(msg){
    curTF=null;var v=viewNotes();cur=v.length?v[0].id:null;
    if(!v.length)$('app').classList.remove('edit');
    renderList();renderMain();showToast(msg,false);
  }
  function folders(){var o=[];notes.forEach(function(n){if(!n.deleted&&n.folder&&o.indexOf(n.folder)<0)o.push(n.folder)});return o.sort()}
  function renderChips(){
    if(inTrash){$('chips').innerHTML='';return}
    var f=folders();if(curFolder&&f.indexOf(curFolder)<0)curFolder='';
    $('chips').innerHTML=f.length?['']. concat(f).map(function(x){return '<button class="chip'+(x===curFolder?' on':'')+'" data-f="'+esc(x)+'">'+(x?esc(x):'All')+'</button>'}).join('')+(curFolder?'<button class="chipdel" id="delfolder">Delete folder</button>':''):'';
  }
  function sync(n){
    n.body=n.items.map(function(x){return x.x}).join('\n');n.t=Date.now();save();renderList();
    var m=$('meta');if(m)m.textContent=metaText(n);
  }
  function focusItem(i){var el=document.querySelectorAll('.it-text')[i];if(el)el.focus()}
  function bodyHTML(n){
    if(n.type==='list'){
      return '<div class="items" id="items">'+n.items.map(function(x,i){return '<div class="it"><input type="checkbox" class="cb" data-i="'+i+'"'+(x.d?' checked':'')+' aria-label="Done"><input class="it-text'+(x.d?' done':'')+'" data-i="'+i+'" value="'+esc(x.x)+'" placeholder="List item" aria-label="List item"><button class="rm" data-i="'+i+'" aria-label="Remove item">×</button></div>'}).join('')+'<button class="ghost addit" id="addit">Add item</button></div>';
    }
    return '<textarea class="body" id="b" placeholder="Start writing…" aria-label="Note text">'+esc(n.body)+'</textarea>';
  }
  function metaText(n){
    if(n.type==='list'){var d=n.items.filter(function(x){return x.d}).length;return 'Edited '+fmt(n.t)+' · '+d+' of '+n.items.length+' done'}
    return metaTextOld(n)}
  function metaTextOld(n){var w=n.body.trim()?n.body.trim().split(/\s+/).length:0;return 'Edited '+fmt(n.t)+' · '+w+(w===1?' word':' words')}
  function showToast(msg,undo){$('tmsg').textContent=msg;$('undo').style.display=undo?'':'none';$('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('show');trash=null},6000)}
  function renderList(){
    renderChips();
    var l=$('list'),term=q.toLowerCase();
    var tc=notes.filter(function(n){return n.deleted&&!n.delFolder}).length+trashFolders('').length;
    $('tbtn').textContent=inTrash?'Back to notes':'Trash'+(tc?' ('+tc+')':'');
    var shown=notes.filter(function(n){return inTrash?(!!n.deleted&&!n.delFolder):!n.deleted}).sort(function(a,b){
      if(!!b.pin!==!!a.pin)return b.pin?1:-1;
      if(sortBy==='title')return (a.title||'').localeCompare(b.title||'');
      if(sortBy==='color')return a.color-b.color||b.t-a.t;
      return b.t-a.t}).filter(function(n){if(!inTrash&&curFolder&&n.folder!==curFolder)return false;return !term||(n.title+' '+n.body).toLowerCase().indexOf(term)>-1});
    var tf=inTrash?trashFolders(term):[];
    if(!shown.length&&!tf.length){l.innerHTML='<div class="empty">'+(term?'No notes match that search.':(inTrash?'The trash is empty.':'No notes yet. Choose New note to start.'))+'</div>';return}
    l.innerHTML=(inTrash?'<button class="ghost" id="emptybtn" style="margin:2px 4px 8px">Empty trash</button>':'')+tf.map(function(f){return '<button class="item'+(f.name===curTF?' on':'')+'" data-tf="'+esc(f.name)+'" style="--c:#B5C79F"><b>📁 '+esc(f.name)+'</b><span>'+f.count+(f.count===1?' note':' notes')+' · deleted with folder</span></button>'}).join('')+shown.map(function(n){
      var prev=n.type==='list'?('☐ '+n.items.filter(function(x){return x.d}).length+' of '+n.items.length+' done'):(n.body.replace(/\s+/g,' ').trim()||'No more text');
      return '<button class="item'+(n.pin?' pinned':'')+(n.id===cur?' on':'')+'" data-id="'+n.id+'" style="--c:'+COLORS[n.color]+'"><b'+((n.stickers&&n.stickers.length)?' style="padding-right:'+(Math.min(n.stickers.length,5)*18+8)+'px"':'')+'>'+(n.pin?'<i class="pin" style="font-style:normal">★</i>':'')+esc(n.title||'Untitled')+'</b><span>'+esc(prev)+'</span>'+((n.stickers&&n.stickers.length)?'<em class="stkrow">'+n.stickers.slice(-5).map(function(s){return s.e}).join('')+'</em>':'')+washi(n)+'</button>';
    }).join('');
  }
  function renderMain(){
    var m=$('main'),n=get(cur);
    if(inTrash&&curTF){
      var fn=notes.filter(function(x){return x.deleted&&x.delFolder===curTF});
      if(fn.length){
        m.innerHTML='<div class="bar"><button class="ghost back" id="back">Back</button><span class="sp"></span><button class="ghost" id="restorefolder">Restore folder</button><button class="ghost" id="purgefolder">Delete forever</button></div><h2 class="ro-title">📁 '+esc(curTF)+'</h2><div class="meta">In the trash · '+fn.length+(fn.length===1?' note':' notes')+' will come back with it</div><div class="ro-body">'+fn.map(function(x){return '• '+esc(x.title||'Untitled')}).join('<br>')+'</div>';
        return;
      }
      curTF=null;
    }
    if(!n){m.innerHTML='<div class="none">Nothing open.<br>Choose a note or start a new one.</div>';return}
    if(n.deleted){
      m.innerHTML='<div class="bar"><button class="ghost back" id="back">Back</button><span class="sp"></span><button class="ghost" id="restore">Restore</button><button class="ghost" id="purge">Delete forever</button></div><h2 class="ro-title">'+esc(n.title||'Untitled')+'</h2><div class="meta">In the trash · deleted '+fmt(n.deleted)+'</div><div class="ro-body">'+(n.type==='list'?n.items.map(function(x){return (x.d?'☑ ':'☐ ')+esc(x.x)}).join('<br>'):esc(n.body))+'</div>';
      return;
    }
    m.innerHTML='<div class="bar"><button class="ghost back" id="back">Back</button>'+
      COLORS.map(function(c,i){return '<button class="dot'+(i===n.color?' on':'')+'" data-c="'+i+'" style="--c:'+c+'" aria-label="Tag color '+(i+1)+'"></button>'}).join('')+
      '<span class="sp"></span><button class="ghost'+(trayOpen?' warn':'')+'" id="stk">Stickers</button><button class="ghost" id="mode">'+(n.type==='list'?'Text':'Checklist')+'</button><button class="ghost'+(n.pin?' warn':'')+'" id="pin">'+(n.pin?'★ Pinned':'Pin')+'</button><button class="ghost" id="copy">Copy</button><button class="ghost" id="theme">Theme</button><button class="ghost" id="del">Delete</button></div>'+
      (trayOpen?trayHTML():'')+'<input class="title" id="t" placeholder="Title" aria-label="Title" value="'+esc(n.title)+'">'+
      '<div class="frow"><select class="folder" id="fsel" aria-label="Folder"><option value="">No folder</option>'+folders().map(function(x){return '<option value="'+esc(x)+'"'+(x===n.folder?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'<option value="__new">+ New folder…</option></select><span id="nfw" style="display:none;gap:6px;align-items:center"><input class="folder" id="nf" placeholder="Folder name" aria-label="New folder name"><button class="ghost" id="nfok">Add</button></span><span class="meta" id="meta">'+metaText(n)+'</span></div>'+
      '<div class="sheet">'+bodyHTML(n)+'<div class="stk-layer" id="stkl"></div></div>';
    renderStickers(n);
  }
  function open(id){cur=id;curTF=null;$('app').classList.add('edit');renderList();renderMain()}
  function add(){
    var n={id:uid(),title:'',body:'',color:0,t:Date.now(),type:'text',folder:curFolder};
    inTrash=false;notes.push(n);save();q='';$('q').value='';open(n.id);
    var t=$('t');if(t)t.focus();
    petCheer();
  }

  $('new').onclick=add;
  function commitFolder(){
    var n=get(cur),v=($('nf').value||'').trim();
    if(!n)return; if(!v){renderMain();return}
    n.folder=v;save();renderList();renderMain();
  }
  $('main').addEventListener('change',function(e){
    if(e.target.id!=='fsel')return;
    var n=get(cur);if(!n)return;
    if(e.target.value==='__new'){var w=$('nfw');w.style.display='flex';$('nf').focus();return}
    n.folder=e.target.value;save();renderList();renderMain();
  });
  $('main').addEventListener('keydown',function(e){
    if(e.target.id==='nf'){if(e.key==='Enter'){e.preventDefault();commitFolder()}else if(e.key==='Escape'){renderMain()}}
  });
  $('main').addEventListener('click',function(e){if(e.target.id==='nfok')commitFolder()});
  $('chips').onclick=function(e){
    var d=e.target.closest('#delfolder');
    if(d){
      if(!armF){armF=true;d.textContent='Tap again to delete';d.classList.add('warn');clearTimeout(armFT);armFT=setTimeout(function(){armF=false;var x=$('delfolder');if(x){x.textContent='Delete folder';x.classList.remove('warn')}},3500);return}
      armF=false;clearTimeout(armFT);var name=curFolder,ts=Date.now();
      notes.forEach(function(n){if(!n.deleted&&n.folder===name){n.deleted=ts;n.delFolder=name}});
      curFolder='';
      var cn=get(cur);if(cn&&cn.deleted){var v=viewNotes();cur=v.length?v[0].id:null;if(!v.length)$('app').classList.remove('edit')}
      save();renderList();renderMain();showToast('Folder moved to trash',false);return;
    }
    var b=e.target.closest('.chip');if(b){armF=false;curFolder=b.dataset.f;renderList()}};
  $('main').addEventListener('click',function(e){
    var n=get(cur),t=e.target;if(!n||n.type!=='list')return;
    if(t.classList.contains('cb')){var i=+t.dataset.i;n.items[i].d=t.checked;t.nextElementSibling.classList.toggle('done',t.checked);sync(n);
      var real=n.items.filter(function(x){return x.x.trim()});
      if(t.checked&&real.length&&real.every(function(x){return x.d}))celebrate()}
    else if(t.classList.contains('rm')){n.items.splice(+t.dataset.i,1);if(!n.items.length)n.items=[{d:false,x:''}];sync(n);renderMain()}
    else if(t.id==='addit'){n.items.push({d:false,x:''});sync(n);renderMain();focusItem(n.items.length-1)}
  });
  $('main').addEventListener('keydown',function(e){
    var n=get(cur),t=e.target;if(!n||n.type!=='list'||!t.classList.contains('it-text'))return;
    var i=+t.dataset.i;
    if(e.key==='Enter'){e.preventDefault();n.items.splice(i+1,0,{d:false,x:''});sync(n);renderMain();focusItem(i+1)}
    else if(e.key==='Backspace'&&t.value===''&&n.items.length>1){e.preventDefault();n.items.splice(i,1);sync(n);renderMain();focusItem(Math.max(0,i-1))}
  });

  $('main').addEventListener('pointerdown',function(e){
    var t=e.target.closest('.ts,.stk');if(!t||e.button>0)return;
    var n=get(cur);if(!n)return;
    e.preventDefault();
    var idx=t.classList.contains('stk')?+t.dataset.si:-1;
    var emoji=idx>=0?n.stickers[idx].e:t.dataset.e;
    var g=document.createElement('span');g.className='gst';g.textContent=emoji;document.body.appendChild(g);
    if(idx>=0)t.style.opacity='0';
    document.body.classList.add('dragging');
    var sx=e.clientX,sy=e.clientY,moved=false;
    function mv(ev){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>5)moved=true}
    function up(ev){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      g.remove();document.body.classList.remove('dragging');
      var ok=ev.type==='pointerup'&&moved,l=$('stkl');
      if(ok&&l){
        var r=l.getBoundingClientRect();
        var inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
        if(inside){
          var x=Math.max(3,Math.min(97,(ev.clientX-r.left)/r.width*100)),y=Math.max(3,Math.min(97,(ev.clientY-r.top)/r.height*100));
          if(idx>=0){n.stickers[idx].x=x;n.stickers[idx].y=y}
          else{n.stickers=n.stickers||[];n.stickers.push({e:emoji,x:x,y:y,r:Math.round(Math.random()*40-20)});if(n.stickers.length>16)n.stickers.shift()}
          save();renderStickers(n,idx<0);renderList();return;
        }
        if(idx>=0){n.stickers.splice(idx,1);save();renderStickers(n);renderList();return}
      }
      if(idx>=0)renderStickers(n);
    }
    mv(e);
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
  $('main').addEventListener('keydown',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('stk')&&(e.key==='Delete'||e.key==='Backspace')){
      e.preventDefault();var n=get(cur);if(!n)return;n.stickers.splice(+t.dataset.si,1);save();renderStickers(n);renderList();
    }
  });
  $('sort').onchange=function(e){sortBy=e.target.value;renderList()};
  $('tbtn').onclick=function(){inTrash=!inTrash;curTF=null;var v=viewNotes();cur=v.length?v[0].id:null;$('app').classList.remove('edit');renderList();renderMain()};
  $('undo').onclick=function(){if(trash){trash.deleted=null;save();inTrash=false;open(trash.id);trash=null;$('toast').classList.remove('show')}};
  $('q').oninput=function(e){q=e.target.value;renderList()};
  $('list').onclick=function(e){
    var eb=e.target.closest('#emptybtn');
    if(eb){
      if(!armE){armE=true;eb.textContent='Tap again to empty';eb.classList.add('warn');clearTimeout(armET);armET=setTimeout(function(){armE=false;var x=$('emptybtn');if(x){x.textContent='Empty trash';x.classList.remove('warn')}},3500);return}
      armE=false;notes=notes.filter(function(x){return !x.deleted});save();cur=null;curTF=null;$('app').classList.remove('edit');renderList();renderMain();showToast('Trash emptied',false);return;
    }
    var b=e.target.closest('.item');if(b){if(b.dataset.tf!==undefined)openTF(b.dataset.tf);else open(b.dataset.id)}};
  $('main').addEventListener('input',function(e){
    var n=get(cur);if(!n)return;
    if(e.target.classList.contains('it-text')){n.items[+e.target.dataset.i].x=e.target.value;sync(n);return}
    if(e.target.id==='t')n.title=e.target.value;
    else if(e.target.id==='b')n.body=e.target.value;
    else return;
    n.t=Date.now();save();renderList();
    var m=$('meta');if(m)m.textContent=metaText(n);
  });
  $('main').addEventListener('click',function(e){
    var n=get(cur),t=e.target;
    if(t.id==='back'){$('app').classList.remove('edit');return}
    if(t.id==='theme'){
      var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme=dark?'light':'dark';return;
    }
    if(t.id==='restorefolder'){
      notes.forEach(function(x){if(x.deleted&&x.delFolder===curTF){x.deleted=null;x.delFolder=null}});
      save();afterTrashChange('Folder restored with its notes');return;
    }
    if(t.id==='purgefolder'){
      if(!armP){armP=true;t.textContent='Tap again to delete forever';t.classList.add('warn');clearTimeout(armPT);armPT=setTimeout(function(){armP=false;var x=$('purgefolder');if(x){x.textContent='Delete forever';x.classList.remove('warn')}},3500);return}
      armP=false;var nm=curTF;
      notes=notes.filter(function(x){return !(x.deleted&&x.delFolder===nm)});
      save();afterTrashChange('Folder deleted forever');return;
    }
    if(!n)return;
    if(t.id==='restore'){n.deleted=null;save();afterTrashChange('Note restored');return}
    if(t.id==='purge'){
      if(!armP){armP=true;t.textContent='Tap again to delete forever';t.classList.add('warn');clearTimeout(armPT);armPT=setTimeout(function(){armP=false;var x=$('purge');if(x){x.textContent='Delete forever';x.classList.remove('warn')}},3500);return}
      armP=false;notes=notes.filter(function(x){return x.id!==n.id});save();afterTrashChange('Deleted forever');return;
    }
    if(t.id==='stk'){trayOpen=!trayOpen;renderMain();return}
    if(t.classList.contains('ts')){if(e.detail===0)stamp(n,t.dataset.e);return}
    if(t.classList.contains('stk'))return;
    if(t.id==='clrstk'){
      if(!(n.stickers&&n.stickers.length)){showToast('No stickers on this note',false);return}
      if(!armS){armS=true;t.textContent='Tap again to remove all';t.classList.add('warn');clearTimeout(armST);armST=setTimeout(function(){armS=false;var x=$('clrstk');if(x){x.textContent='Remove all';x.classList.remove('warn')}},3500);return}
      armS=false;clearTimeout(armST);n.stickers=[];save();renderStickers(n);renderList();t.textContent='Remove all';t.classList.remove('warn');return;
    }
    if(t.id==='mode'){
      if(n.type==='list'){n.type='text';n.body=n.items.map(function(x){return x.x}).join('\n')}
      else{n.type='list';n.items=n.body.split('\n').filter(function(l){return l.trim()}).map(function(l){return {d:false,x:l}});if(!n.items.length)n.items=[{d:false,x:''}]}
      n.t=Date.now();save();renderList();renderMain();return}
    if(t.id==='pin'){n.pin=!n.pin;justPinned=n.pin?n.id:null;save();renderList();justPinned=null;renderMain();return}
    if(t.id==='copy'){
      var txt=(n.title?n.title+'\n\n':'')+n.body;
      try{navigator.clipboard.writeText(txt).then(function(){showToast('Copied to clipboard',false)},function(){showToast('Copy isn’t available here',false)})}catch(x){showToast('Copy isn’t available here',false)}
      return;
    }
    if(t.id==='del'){
      if(!armed){armed=true;t.textContent='Tap again to delete';t.classList.add('warn');clearTimeout(armT);armT=setTimeout(function(){armed=false;if($('del')){$('del').textContent='Delete';$('del').classList.remove('warn')}},3500);return}
      armed=false;clearTimeout(armT);
      n.deleted=Date.now();trash=n;save();
      var nx=viewNotes()[0];
      cur=nx?nx.id:null;
      if(!nx)$('app').classList.remove('edit');
      renderList();renderMain();showToast('Moved to trash',true);return;
    }
    if(t.dataset&&t.dataset.c!==undefined){n.color=+t.dataset.c;save();renderList();renderMain()}
  });

  // ---- tea break timer ----
  var TEA=300,teaEnd=0,teaIv=null,muted=false,petalsOn=true,audio=null;
  try{muted=localStorage.getItem('cn-muted')==='1';petalsOn=localStorage.getItem('cn-petals')!=='0'}catch(e){}
  function ac(){try{if(!audio){var C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio&&audio.state==='suspended')audio.resume();return audio}catch(e){return null}}
  function noiseBuf(c,d){var b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
  function tone(c,f,st,dur,vol,type){var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+dur);o.connect(g);g.connect(c.destination);o.start(st);o.stop(st+dur+0.05)}
  function sndPour(){
    if(muted)return;var c=ac();if(!c)return;
    try{
      var t=c.currentTime,src=c.createBufferSource();src.buffer=noiseBuf(c,1.7);
      var f=c.createBiquadFilter();f.type='bandpass';f.Q.value=0.9;f.frequency.setValueAtTime(800,t);f.frequency.linearRampToValueAtTime(1600,t+1.5);
      var g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.25);g.gain.exponentialRampToValueAtTime(0.0001,t+1.7);
      src.connect(f);f.connect(g);g.connect(c.destination);src.start(t);
      for(var i=0;i<8;i++){var st=t+0.15+i*0.17+Math.random()*0.05,fr=380+Math.random()*500,o=c.createOscillator(),og=c.createGain();
        o.frequency.setValueAtTime(fr,st);o.frequency.exponentialRampToValueAtTime(fr*1.8,st+0.09);
        og.gain.setValueAtTime(0.0001,st);og.gain.exponentialRampToValueAtTime(0.07,st+0.01);og.gain.exponentialRampToValueAtTime(0.0001,st+0.1);
        o.connect(og);og.connect(c.destination);o.start(st);o.stop(st+0.12)}
    }catch(e){}
  }
  function sndDone(){
    if(muted)return;var c=ac();if(!c)return;
    try{var t=c.currentTime;[784,988,1175,1568].forEach(function(f,i){tone(c,f,t+i*0.24,1.1,0.12)});tone(c,392,t,1.6,0.06,'triangle')}catch(e){}
  }
  function fmtT(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
  function teaTick(){
    var left=Math.max(0,Math.round((teaEnd-Date.now())/1000));
    $('tlabel').textContent=fmtT(left);
    if(Date.now()>=teaEnd)teaStop(true);
  }
  function teaStart(){
    teaEnd=Date.now()+TEA*1000;sndPour();
    $('tea').classList.add('on');$('teabtn').title='Click to cancel the tea break';$('teabtn').setAttribute('aria-label','Cancel the tea break');
    teaTick();teaIv=setInterval(teaTick,250);
    showToast('Tea break started · 5 minutes ☕',false);
  }
  function teaStop(done){
    clearInterval(teaIv);teaIv=null;
    $('tea').classList.remove('on');$('tlabel').textContent='';
    $('teabtn').title='Start a 5-minute tea break';$('teabtn').setAttribute('aria-label','Start a 5-minute tea break');
    if(done){sndDone();showToast('Tea break! Time for a cozy stretch ☕✨',false)}
    else showToast('Tea break cancelled',false);
  }
  $('teabtn').onclick=function(){if(teaIv)teaStop(false);else teaStart()};
  function applyToggles(){
    $('mutebtn').textContent=muted?'🔕':'🔔';$('mutebtn').setAttribute('aria-pressed',String(muted));
    $('petals').style.display=petalsOn?'':'none';$('petalbtn').classList.toggle('off',!petalsOn);$('petalbtn').setAttribute('aria-pressed',String(petalsOn));
  }
  $('mutebtn').onclick=function(){muted=!muted;try{localStorage.setItem('cn-muted',muted?'1':'0')}catch(e){}applyToggles()};
  $('petalbtn').onclick=function(){petalsOn=!petalsOn;try{localStorage.setItem('cn-petals',petalsOn?'1':'0')}catch(e){}applyToggles()};

  // ---- falling petals ----
  (function(){
    var h='';
    for(var i=0;i<14;i++){
      var sz=10+Math.random()*10,d=14+Math.random()*12,dl=-Math.random()*d;
      h+='<i class="pt" style="left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+(sz*0.8)+'px;animation-duration:'+d+'s,'+(d/3.2)+'s;animation-delay:'+dl+'s,'+dl+'s;--sw:'+(20+Math.random()*50)+'px;opacity:'+(0.35+Math.random()*0.3)+'"></i>';
    }
    $('petals').innerHTML=h;
  })();

  // ---- animal friend ----
  var PETS=['🐱','🐸','🦔'],petIdx=0,petT=null,lastMsg=-1;
  var MSGS=['Great job staying organized! 🌲','Keep it up! ✨','Another note for the nest! 🍄','Look at you go! 🌷','Cozy and productive! ☕','Nice thinking! 🌸','So tidy, so cute! 🎀'];
  try{var pi=+localStorage.getItem('cn-pet');if(pi>=0&&pi<PETS.length)petIdx=pi}catch(e){}
  function petSay(msg){
    var b=$('bubble');b.textContent=msg;b.classList.add('show');
    clearTimeout(petT);petT=setTimeout(function(){b.classList.remove('show')},4200);
    if(!$('friend').offsetParent)showToast(PETS[petIdx]+' '+msg,false);
  }
  function petCheer(){var i;do{i=Math.floor(Math.random()*MSGS.length)}while(i===lastMsg);lastMsg=i;petSay(MSGS[i])}
  $('pet').onclick=function(){petIdx=(petIdx+1)%PETS.length;try{localStorage.setItem('cn-pet',String(petIdx))}catch(e){}$('pet').textContent=PETS[petIdx];petSay('Hi there! 🐾')};
  $('pet').textContent=PETS[petIdx];
  applyToggles();

  notes=load();notes.forEach(function(n){if(!n.type)n.type='text';if(n.type==='list'&&!n.items)n.items=[{d:false,x:''}]});
  cur=viewNotes().length?viewNotes()[0].id:null;
  renderList();renderMain();
})();
</script>
</body>
</html>
